<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Game purchase responsive preview</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: #ececec; color: #161616; font: 16px/1.4 system-ui, sans-serif; }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0 0 12px; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
    select, button { padding: 10px; font: inherit; }
    button { cursor: pointer; }
    .frame-area { max-width: 100%; overflow: auto; }
    iframe { display: block; border: 1px solid #555; background: #120c08; }
    #status { margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Game purchase responsive preview</h1>
  <p>Developer fixture using the real markup, styles and checkout. Gameplay and analytics are disabled.</p>
  <div class="controls">
    <label>Viewport
      <select id="viewport">
        <option value="320,568">320 × 568</option>
        <option value="375,667">375 × 667</option>
        <option value="390,844" selected>390 × 844</option>
        <option value="667,375">667 × 375 landscape</option>
        <option value="960,700">960 × 700</option>
        <option value="1280,720">1280 × 720</option>
      </select>
    </label>
    <button type="button" data-view="results">Game results</button>
    <button type="button" data-view="packages">Package chooser</button>
    <button type="button" data-view="checkout">VIP checkout</button>
  </div>
  <div class="frame-area"><iframe id="preview" title="Sized game purchase preview"></iframe></div>
  <p id="status" role="status">Loading current game markup…</p>
  <script>
    (async () => {
      const frame = document.querySelector("#preview");
      const viewport = document.querySelector("#viewport");
      const status = document.querySelector("#status");
      let view = "packages";
      const size = () => {
        const [width, height] = viewport.value.split(",");
        frame.width = width;
        frame.height = height;
      };
      const show = () => frame.contentWindow.postMessage({ previewView: view }, location.origin);
      viewport.addEventListener("change", size);
      document.querySelectorAll("[data-view]").forEach(button => button.addEventListener("click", () => {
        view = button.dataset.view;
        show();
      }));
      size();
      try {
        const response = await fetch("../../game/", { cache: "no-store" });
        if (!response.ok) throw new Error("Game markup returned " + response.status);
        const page = new DOMParser().parseFromString(await response.text(), "text/html");
        page.querySelectorAll("script").forEach(script => script.remove());
        const base = page.createElement("base");
        base.href = new URL("../../game/", location.href).href;
        page.head.prepend(base);
        page.querySelector("#start-overlay").hidden = true;
        page.querySelector("#gameover-overlay").hidden = false;
        page.querySelector("#gameover-title").textContent = "NEW BEST SCORE";
        page.querySelector("#final-score").textContent = "12,480";
        page.querySelector("#final-longest-streak").textContent = "12";
        const script = page.createElement("script");
        script.src = new URL("../../purchase-flow.js?v=20261007-game-packages-1", location.href).href;
        page.body.append(script);
        const init = page.createElement("script");
        init.textContent = `
          MovieMasterPurchaseFlow.setUpTextContacts();
          const purchase = MovieMasterPurchaseFlow.init({ restoreOpen: false, packagesOnly: true });
          const launch = document.querySelector('#gameover-packages-button');
          launch.addEventListener('click', () => {
            purchase.open(null, launch, true);
            document.querySelector('#purchase-dialog-title').focus();
          });
          window.addEventListener('message', event => {
            if (event.origin !== location.origin || !event.data.previewView) return;
            if (event.data.previewView === 'results') purchase.close();
            else {
              launch.click();
              if (event.data.previewView === 'checkout') document.querySelector('[data-package-select="vip"]').click();
            }
          });
        `;
        page.body.append(init);
        frame.addEventListener("load", () => { show(); status.textContent = "Preview ready. No visits or game runs are submitted."; });
        frame.srcdoc = "<!doctype html>" + page.documentElement.outerHTML;
      } catch (error) { status.textContent = error.message; }
    })();
  </script>
</body>
</html>
