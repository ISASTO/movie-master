name: Game onboarding patch

on:
  push:
    branches:
      - game-info-onboarding
    paths:
      - .github/workflows/game-onboarding-patch.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: game-info-onboarding
          fetch-depth: 0

      - name: Apply onboarding patch
        run: python .github/scripts/apply-game-onboarding.py

      - name: Validate JavaScript syntax
        run: node --check game/game.js

      - name: Validate diff whitespace
        run: git diff --check

      - name: Validate requested behavior markers
        run: |
          grep -q 'id="info-button"' game/index.html
          grep -q 'id="info-overlay"' game/index.html
          grep -q 'COLLECT POPCORN FOR UPGRADES' game/index.html
          grep -q 'ctx.strokeStyle = danger ? "#ff806b" : COLORS.goldBright;' game/game.js
          ! grep -q 'danger ? "pickup-beam-danger"' game/game.js
          ! grep -q 'danger ? "#ff5a3b"' game/game.js

      - name: Commit validated production changes
        run: |
          if git diff --quiet -- game/index.html game/game.js game/game.css; then
            echo "No production changes to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/index.html game/game.js game/game.css
          git commit -m "Simplify game onboarding and popcorn warning"
          git push origin HEAD:game-info-onboarding
