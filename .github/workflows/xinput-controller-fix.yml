name: XInput controller compatibility

on:
  push:
    branches:
      - fix-xinput-controller-detection
    paths:
      - .github/workflows/xinput-controller-fix.yml

permissions:
  contents: write

jobs:
  patch-test-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix-xinput-controller-detection
          fetch-depth: 0

      - name: Benchmark current controller polling
        run: |
          node --expose-gc benchmarks/game-performance.js \
            --root . \
            --scenario no-controller-poll,connected-controller-poll \
            --samples 15 \
            --warmups 6 \
            --label before \
            --output /tmp/controller-before.json

      - name: Apply compatibility patch
        run: python .github/scripts/fix-xinput-detection.py

      - name: Validate JavaScript and controller navigation
        run: |
          node --check game/game.js
          node benchmarks/game-performance.js --verify-controller-menu
          git diff --check

      - name: Benchmark patched controller polling
        run: |
          node --expose-gc benchmarks/game-performance.js \
            --root . \
            --scenario no-controller-poll,connected-controller-poll \
            --samples 15 \
            --warmups 6 \
            --label after \
            --output /tmp/controller-after.json

      - name: Report benchmark comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          before = json.loads(Path('/tmp/controller-before.json').read_text())
          after = json.loads(Path('/tmp/controller-after.json').read_text())

          def scenarios(payload):
              rows = payload.get('scenarios', payload.get('results', []))
              return {row['name']: row for row in rows}

          b = scenarios(before)
          a = scenarios(after)
          for name in ('no-controller-poll', 'connected-controller-poll'):
              if name not in b or name not in a:
                  raise SystemExit(f'missing benchmark scenario: {name}')
              before_ms = float(b[name].get('unitMedianMs', b[name].get('medianPerUnitMs', 0)))
              after_ms = float(a[name].get('unitMedianMs', a[name].get('medianPerUnitMs', 0)))
              print(f'{name}: before={before_ms:.9f} ms/poll after={after_ms:.9f} ms/poll')
              # Even a much larger relative change here is irrelevant if the
              # absolute work remains below 0.02 ms per animation frame.
              if after_ms >= 0.02:
                  raise SystemExit(f'{name} controller polling exceeded 0.02 ms/poll')
          PY

      - name: Commit validated production files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/game.js game/index.html
          git commit -m "Restore virtual XInput controller detection"
          git push origin HEAD:fix-xinput-controller-detection
