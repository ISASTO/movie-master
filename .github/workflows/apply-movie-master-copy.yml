name: Apply Movie Master copy edits

on:
  push:
    branches:
      - agent/movie-master-site
    paths:
      - .github/workflows/apply-movie-master-copy.yml

permissions:
  contents: write

jobs:
  patch-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site branch
        uses: actions/checkout@v4
        with:
          ref: agent/movie-master-site

      - name: Apply exact requested edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  """If you're fed up with
              watching garbage 🗑️ and you want to finally start watching the
              best movies ever made, it's time you let the Movie Master decide
              what you should watch.""",
                  """If you're tired of cable and streaming services not
              delivering the quality of movies you're looking for, and you want
              to finally start watching the best movies ever made, it's time you
              let the Movie Master decide what movies you should watch.""",
              ),
              (
                  """              <p>He's not called the Television Show Master, is he?</p>""",
                  """              <p>
                While the best Smash Blockbuster Hit Masterpiece Movies may be
                his specialty, the Movie Master can indeed also recommend
                television shows, and even R&amp;B and rap music videos.
              </p>""",
              ),
              (
                  """            <div class="specialty-card"><span>★</span>The best Police Movies</div>
            <div class="specialty-card specialty-card-wide">""",
                  """            <div class="specialty-card"><span>★</span>The best Police Movies</div>
            <div class="specialty-card"><span>★</span>The best Drama Movies</div>
            <div class="specialty-card"><span>★</span>The best Suspense Movies</div>
            <div class="specialty-card specialty-card-wide">""",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit the edits and remove this one-off workflow
        shell: bash
        run: |
          rm .github/workflows/apply-movie-master-copy.yml
          git config user.name "Movie Master Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/apply-movie-master-copy.yml
          git commit -m "Update Movie Master services and specialties"
          git push origin HEAD:agent/movie-master-site
