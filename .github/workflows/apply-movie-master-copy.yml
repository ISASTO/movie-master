name: Apply Movie Master copy edits

on:
  push:
    branches:
      - agent/movie-master-site
    paths:
      - .github/workflows/apply-movie-master-copy.yml

permissions:
  contents: write

jobs:
  patch-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site branch
        uses: actions/checkout@v4
        with:
          ref: agent/movie-master-site

      - name: Apply exact requested edits
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          edits = [
              (
                  re.compile(
                      r"If you're fed up with\s+watching garbage 🗑️ and you want to finally start watching the\s+best movies ever made, it's time you let the Movie Master decide\s+what you should watch\."
                  ),
                  "If you're tired of cable and streaming services not\n"
                  "              delivering the quality of movies you're looking for, and you want\n"
                  "              to finally start watching the best movies ever made, it's time you\n"
                  "              let the Movie Master decide what movies you should watch.",
              ),
              (
                  re.compile(r"<p>He's not called the Television Show Master, is he\?</p>"),
                  "<p>\n"
                  "                While the best Smash Blockbuster Hit Masterpiece Movies may be\n"
                  "                his specialty, the Movie Master can indeed also recommend\n"
                  "                television shows, and even R&amp;B and rap music videos.\n"
                  "              </p>",
              ),
              (
                  re.compile(
                      r'<div class="specialty-card"><span>★</span>The best Police Movies</div>\s+' 
                      r'<div class="specialty-card specialty-card-wide">'
                  ),
                  '<div class="specialty-card"><span>★</span>The best Police Movies</div>\n'
                  '            <div class="specialty-card"><span>★</span>The best Drama Movies</div>\n'
                  '            <div class="specialty-card"><span>★</span>The best Suspense Movies</div>\n'
                  '            <div class="specialty-card specialty-card-wide">',
              ),
          ]

          for pattern, replacement in edits:
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, found {count}: {pattern.pattern}")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit the edits and remove this one-off workflow
        shell: bash
        run: |
          rm .github/workflows/apply-movie-master-copy.yml
          git config user.name "Movie Master Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/apply-movie-master-copy.yml
          git commit -m "Update Movie Master services and specialties"
          git push origin HEAD:agent/movie-master-site
