name: Temporary Performance Follow-up

on:
  push:
    branches:
      - cloudflare-performance-slim

permissions:
  contents: write

jobs:
  followup:
    if: github.event.head_commit.message != 'Finish Cloudflare performance slim pass'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply follow-up optimizations
        run: python scripts/perf_followup.py

      - name: Run Worker regression tests
        working-directory: counter-worker
        run: npm test

      - name: Check browser syntax
        run: |
          node --check game/leaderboard.js
          node --check analytics/auto-refresh.js

      - name: Verify follow-up targets
        run: |
          grep -q 'if (normal <= 0 && hardcore <= 0)' game/leaderboard.js
          grep -q 'const QUIET_MIN_AGE_MS = AUTO_REFRESH_MS' analytics/auto-refresh.js
          grep -q 'leaderboard.js?v=20260902-perf-2' game/index.html
          grep -q 'auto-refresh.js?v=20260902-perf-2' analytics/index.html

      - name: Commit follow-up production files
        run: |
          git config user.name ISASTO
          git config user.email 54598558+ISASTO@users.noreply.github.com
          git add game/leaderboard.js game/index.html analytics/auto-refresh.js analytics/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Finish Cloudflare performance slim pass'
          git push origin HEAD:cloudflare-performance-slim
