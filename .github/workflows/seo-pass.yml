# One-time repository SEO updater; remove after successful run.
name: One-time SEO pass

on:
  push:
    branches: [main]
    paths: [.github/workflows/seo-pass.yml]

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: python -m pip install --quiet cairosvg pillow
      - name: Apply SEO changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Missing expected {label}")
              return text.replace(old, new, 1)

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = must_replace(s,
              '    <meta\n      name="description"\n      content="Buy the best and most correct movie recommendations from the Movie Master."\n   >',
              '    <meta\n      name="description"\n      content="Get personalized movie recommendations from the Movie Master — the home of Blockbuster Smash Hit Masterpieces."\n   >',
              'homepage description')
          s = must_replace(s,
              '    <meta property="og:title" content="MOVIE MASTER">',
              '    <meta property="og:title" content="Movie Master | Personalized Movie Recommendations">\n    <meta property="og:site_name" content="Movie Master">',
              'homepage Open Graph title')
          s = must_replace(s,
              '    <meta\n      property="og:description"\n      content="Buy the best and most correct movie recommendations from the Movie Master."\n   >',
              '    <meta\n      property="og:description"\n      content="Get personalized movie recommendations from the Movie Master — the home of Blockbuster Smash Hit Masterpieces."\n   >',
              'homepage Open Graph description')
          s = must_replace(s,
              '    <meta name="twitter:title" content="MOVIE MASTER">',
              '    <meta name="twitter:title" content="Movie Master | Personalized Movie Recommendations">',
              'homepage Twitter title')
          s = must_replace(s,
              '    <meta name="twitter:description" content="Buy the best and most correct movie recommendations from the Movie Master.">',
              '    <meta name="twitter:description" content="Get personalized movie recommendations from the Movie Master — the home of Blockbuster Smash Hit Masterpieces.">',
              'homepage Twitter description')
          s = must_replace(s,
              '    <title>MOVIE MASTER</title>\n    <link rel="icon" href="./assets/images/favicon.svg" type="image/svg+xml">',
              '''    <title>Movie Master | Personalized Movie Recommendations</title>\n    <link rel="icon" href="/assets/images/favicon-192.png" type="image/png" sizes="192x192">\n    <link rel="shortcut icon" href="/favicon.ico">\n    <link rel="apple-touch-icon" href="/assets/images/favicon-192.png">\n    <script type="application/ld+json">\n      {\n        "@context": "https://schema.org",\n        "@type": "WebSite",\n        "name": "Movie Master",\n        "alternateName": ["The Movie Master", "moviemaster.vip"],\n        "url": "https://moviemaster.vip/"\n      }\n    </script>''',
              'homepage title/favicon')
          p.write_text(s, encoding='utf-8')

          p = Path('game/index.html')
          s = p.read_text(encoding='utf-8')
          s = must_replace(s,
              '    <meta property="og:title" content="MOVIE MASTER vs GARBAGE">',
              '    <meta property="og:title" content="Movie Master vs Garbage | Official Movie Master Game">\n    <meta property="og:site_name" content="Movie Master">',
              'game Open Graph title')
          s = must_replace(s,
              '    <meta name="twitter:title" content="MOVIE MASTER vs GARBAGE">',
              '    <meta name="twitter:title" content="Movie Master vs Garbage | Official Movie Master Game">',
              'game Twitter title')
          s = must_replace(s,
              '    <title>MOVIE MASTER vs GARBAGE</title>\n    <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">',
              '    <title>Movie Master vs Garbage | Official Movie Master Game</title>\n    <link rel="icon" href="/assets/images/favicon-192.png" type="image/png" sizes="192x192">\n    <link rel="shortcut icon" href="/favicon.ico">\n    <link rel="apple-touch-icon" href="/assets/images/favicon-192.png">',
              'game title/favicon')
          p.write_text(s, encoding='utf-8')

          p = Path('vip/index.html')
          s = p.read_text(encoding='utf-8')
          s = must_replace(s,
              '    <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">',
              '    <link rel="icon" href="/assets/images/favicon-192.png" type="image/png" sizes="192x192">\n    <link rel="shortcut icon" href="/favicon.ico">\n    <link rel="apple-touch-icon" href="/assets/images/favicon-192.png">',
              'VIP favicon')
          p.write_text(s, encoding='utf-8')

          Path('sitemap.xml').write_text('''<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url>\n    <loc>https://moviemaster.vip/</loc>\n    <lastmod>2026-09-01</lastmod>\n  </url>\n  <url>\n    <loc>https://moviemaster.vip/game/</loc>\n    <lastmod>2026-09-01</lastmod>\n  </url>\n</urlset>\n''', encoding='utf-8')

          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('The official one-page website for the Movie Master.', 'The official website for the Movie Master and personalized Movie Master movie recommendations.\n\nOfficial site: <https://moviemaster.vip/>', 1)
          s = s.replace('Expected URL: <https://isasto.github.io/movie-master/>', 'Canonical URL: <https://moviemaster.vip/>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Generate favicons
        run: |
          python - <<'PY'
          import cairosvg
          from PIL import Image
          source='assets/images/favicon.svg'
          cairosvg.svg2png(url=source, write_to='assets/images/favicon-192.png', output_width=192, output_height=192)
          cairosvg.svg2png(url=source, write_to='assets/images/favicon-512.png', output_width=512, output_height=512)
          Image.open('assets/images/favicon-192.png').convert('RGBA').save('favicon.ico', format='ICO', sizes=[(16,16),(32,32),(48,48)])
          PY
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re,xml.etree.ElementTree as ET
          home=Path('index.html').read_text(encoding='utf-8')
          game=Path('game/index.html').read_text(encoding='utf-8')
          vip=Path('vip/index.html').read_text(encoding='utf-8')
          assert '<title>Movie Master | Personalized Movie Recommendations</title>' in home
          assert '<meta property="og:site_name" content="Movie Master">' in home
          assert 'application/ld+json' in home
          assert 'Official Movie Master Game' in game
          assert 'noindex, nofollow, noarchive' in vip
          m=re.search(r'<script type="application/ld\+json">\s*(\{.*?\})\s*</script>',home,re.S)
          d=json.loads(m.group(1)); assert d['name']=='Movie Master' and d['url']=='https://moviemaster.vip/'
          ET.parse('sitemap.xml')
          for f in ['assets/images/favicon-192.png','assets/images/favicon-512.png','favicon.ico']:
              assert Path(f).stat().st_size > 0
          print('SEO validation passed')
          PY
      - name: Commit
        run: |
          git config user.name "Movie Master Site Maintainer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html game/index.html vip/index.html sitemap.xml README.md assets/images/favicon-192.png assets/images/favicon-512.png favicon.ico
          git commit -m "Improve search indexing metadata"
          git push origin HEAD:main
