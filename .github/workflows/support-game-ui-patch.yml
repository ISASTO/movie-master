name: Support + game UI patch

on:
  push:
    branches:
      - support-modal-and-game-layout
    paths:
      - .github/workflows/support-game-ui-patch.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: support-modal-and-game-layout
          fetch-depth: 0

      - name: Apply combined patch
        run: python .github/scripts/apply-support-game-ui.py

      - name: Validate JavaScript syntax
        run: |
          node --check site-core.js
          node --check script.js

      - name: Validate diff whitespace
        run: git diff --check

      - name: Validate support flow
        run: |
          grep -q 'data-package="support"' index.html
          grep -q 'GIVE THE MOVIE MASTER MONEY' index.html
          grep -q 'I am interested in giving you money for free to help grow your business.' site-core.js
          grep -q 'packageSelector.hidden = isLifetimeInquiry || isSupportInquiry' site-core.js
          grep -q 'Give the Movie Master Money' site-core.js

      - name: Validate game UI requests
        run: |
          grep -q '<span>COLLECT POPCORN FOR UPGRADES</span>' game/index.html
          grep -q '<span>KEEP MOVING TO SHOOT</span>' game/index.html
          grep -q '<span>AVOID GARBAGE 🗑️</span>' game/index.html
          grep -q 'BLOCKBUSTER BLAST IS CHARGED' game/index.html
          grep -q 'align-items: start;' game/game.css
          grep -q 'font-size: clamp(0.76rem, 1.05vw, 0.92rem);' game/game.css

      - name: Commit validated production changes
        run: |
          if git diff --quiet -- index.html site-core.js script.js styles.css game/index.html game/game.css; then
            echo "No production changes to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html site-core.js script.js styles.css game/index.html game/game.css
          git commit -m "Wire support CTA and refine game instructions"
          git push origin HEAD:support-modal-and-game-layout
