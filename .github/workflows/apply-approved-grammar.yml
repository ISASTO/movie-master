name: Apply approved grammar edits

on:
  push:
    branches:
      - agent/movie-master-site
    paths:
      - .github/workflows/apply-approved-grammar.yml

permissions:
  contents: write

jobs:
  patch-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out live site branch
        uses: actions/checkout@v4
        with:
          ref: agent/movie-master-site

      - name: Apply approved copy edits
        shell: bash
        run: |
          echo '' | base64 --decode | python3

      - name: Commit approved edits and remove one-off workflow
        shell: bash
        run: |
          rm .github/workflows/apply-approved-grammar.yml
          git config user.name "Movie Master Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/apply-approved-grammar.yml
          git commit -m "Apply approved grammar fixes"
          git push origin HEAD:agent/movie-master-site
