name: Apply approved grammar edits

on:
  push:
    branches:
      - agent/movie-master-site
    paths:
      - .github/workflows/apply-approved-grammar.yml

permissions:
  contents: write

jobs:
  patch-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out live site branch
        uses: actions/checkout@v4
        with:
          ref: agent/movie-master-site

      - name: Apply approved copy edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          
          replacements = [
              ('million dollar smile', 'million-dollar smile', 2),
              ('With over 50 years of experience, nobody knows the best\n              Blockbuster Smash Hits better than the Movie Master.', 'With over 50 years of experience, the Movie Master knows the best\n              Blockbuster Smash Hits better than anybody in the world.', 1),
              ("But you can also\n                tell him where you heard about him, what kinds of movies you're\n                looking for, and what some of your favorite movies are. Or\n                anything else you think he should know.", "But you can also\n                tell him where you heard about him, what kinds of movies you're\n                looking for, what some of your favorite movies are, or anything\n                else you think he should know.", 1),
              ("My mind is blown away every time I put on a movie that the\n                Movie Master has recommended to me. He's just so smart and he\n                knows all the best movies.", "My mind is blown every time I put on a movie that the Movie\n                Master has recommended to me. He's just so smart, and he knows\n                all the best movies.", 1),
              ("These aren't your average everyday run-of-the-mill movie\n                recommendations you can hear from your friends or online or from\n                a stranger at the grocery store, these are world-class,\n                top-tier, cream-of-the-crop movie recommendations. The Movie\n                Master is truly a master of his craft.", "These aren't your average everyday run-of-the-mill movie\n                recommendations that you can hear from your friend, find online,\n                or hear from a stranger at the grocery store. These are\n                world-class, top-tier, cream-of-the-crop movie recommendations\n                worth every penny. The Movie Master is truly a master of his\n                craft.", 1),
              ('Starvation, war, hatred, division, it would all\n                disappear.', 'Starvation, war, hatred, and division would all disappear.', 1),
              ('I dove\n                right in with 20 movie recommendations for $20 and I never\n                looked back.', 'I dove\n                right in with 20 movie recommendations for $20, and I never\n                looked back.', 1),
              ('I laugh in their\n                face when they recommend garbage 🗑️.', 'I laugh in their\n                faces when they recommend garbage 🗑️.', 1),
              ('recommendations for her 16th birthday and she loved them so\n                much', 'recommendations for her 16th birthday, and she loved them so\n                much', 1),
              ('I now watch a movie (recommended by the Movie Master)\n                every single day and I love every second of them.', 'I now watch a movie (recommended by the Movie Master)\n                every single day, and I love every second of it.', 1),
              ('Picking a movie used to be a pain. Like wading through a\n                disgusting swamp in search of one mediocre gem.', 'Picking a movie used to be a pain. It was like wading through a\n                disgusting swamp in search of one mediocre gem.', 1),
              ('The Movie Master is like if Albert Einstein had decided to\n                focus his mega-genius intellect towards curating Smash\n                Blockbuster Hits instead of physics, only smarter and more\n                handsome.', 'The Movie Master is like Albert Einstein if he had decided to\n                focus his mega-genius intellect on curating Smash Blockbuster\n                Hits instead of physics, only smarter and more handsome.', 1),
          ]
          
          for old, new, expected in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"Expected {expected} match(es), found {count}: {old[:100]!r}")
              text = text.replace(old, new, expected)
          
          required = [
              "million-dollar smile",
              "the Movie Master knows the best",
              "what some of your favorite movies are, or anything",
              "My mind is blown every time",
              "you can hear from your friend, find online,",
              "hatred, and division would all disappear.",
              "for $20, and I never",
              "I laugh in their\n                faces",
              "16th birthday, and she loved",
              "every single day, and I love every second of it.",
              "It was like wading through a",
              "focus his mega-genius intellect on curating",
          ]
          
          for snippet in required:
              if snippet not in text:
                  raise SystemExit(f"Verification failed: {snippet!r}")
          
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit approved edits and remove one-off workflow
        shell: bash
        run: |
          rm .github/workflows/apply-approved-grammar.yml
          git config user.name "Movie Master Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/apply-approved-grammar.yml
          git commit -m "Apply approved grammar fixes"
          git push origin HEAD:agent/movie-master-site
