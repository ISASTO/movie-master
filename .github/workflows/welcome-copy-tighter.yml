name: Welcome copy tighter

on:
  push:
    branches:
      - welcome-copy-tighter
    paths:
      - .github/workflows/welcome-copy-tighter.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: welcome-copy-tighter
          fetch-depth: 0

      - name: Apply production patch
        run: python .github/scripts/tighten-welcome-copy.py

      - name: Validate exact change
        run: |
          grep -A 2 '^.welcome-banner-copy p {' styles.css | grep -q 'max-width: 880px;'
          grep -q 'styles.css?v=20260904-welcome-copy-tight' index.html
          git diff --check

      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css index.html
          git commit -m "Tighten welcome banner copy width"
          git push origin HEAD:welcome-copy-tighter
