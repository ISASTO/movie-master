name: Legacy analytics leaderboard

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/legacy-analytics-leaderboard.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/include-legacy-analytics.py

      - name: Validate JavaScript syntax
        run: |
          node --check counter-worker/src/leaderboards.js
          node --check analytics/mode-leaderboards.js

      - name: Validate behavior markers
        run: |
          python - <<'PY'
          from pathlib import Path
          worker = Path('counter-worker/src/leaderboards.js').read_text()
          client = Path('analytics/mode-leaderboards.js').read_text()
          index = Path('analytics/index.html').read_text()
          assert 'FROM legacy_leaderboard_scores' in worker
          assert 'runId: legacy ? null : row.run_id' in worker
          assert 'await ensureLeaderboardInfrastructure(env.DB);' in worker
          assert 'entry.longestStreak == null ? "—"' in client
          assert 'entry.gameTimeSeconds == null ? "—"' in client
          assert '20260905-legacy-analytics-1' in index
          PY
          git diff --check

      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add counter-worker/src/leaderboards.js analytics/mode-leaderboards.js analytics/index.html
          git commit -m "Show legacy scores in analytics leaderboards"
          git push origin HEAD:main

# retry after tightening patch assertions
