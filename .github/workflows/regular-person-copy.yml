name: Regular person copy

on:
  push:
    branches:
      - regular-person-copy
    paths:
      - .github/workflows/regular-person-copy.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: regular-person-copy
          fetch-depth: 0

      - name: Apply copy change
        run: python .github/scripts/update-regular-person-copy.py

      - name: Validate exact wording
        run: |
          ! grep -q 'a regular adult' index.html
          grep -q 'a regular person' index.html
          git diff --check

      - name: Commit production change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Change regular adult to regular person"
          git push origin HEAD:regular-person-copy
