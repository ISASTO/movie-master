name: Fix mobile masthead fit

on:
  push:
    branches:
      - agent/movie-master-site
    paths:
      - .github/workflows/fix-mobile-masthead.yml

permissions:
  contents: write

jobs:
  patch-masthead:
    runs-on: ubuntu-latest
    steps:
      - name: Check out live site branch
        uses: actions/checkout@v4
        with:
          ref: agent/movie-master-site

      - name: Add responsive masthead guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("styles.css")
          text = path.read_text(encoding="utf-8")
          marker = "/* Mobile masthead overflow guard */"

          if marker in text:
              raise SystemExit("Mobile masthead guard already exists")

          guard = r'''

/* Mobile masthead overflow guard */
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

@media (max-width: 820px) {
  .masthead-stage {
    padding-right: 14px;
    padding-left: 14px;
  }

  .masthead {
    width: 100%;
    max-width: 100%;
    font-size: clamp(2.8rem, 13.8vw, 5.9rem);
  }

  .masthead-face > span {
    width: 100%;
    transform: scaleX(0.98);
    transform-origin: center;
  }
}

@media (max-width: 560px) {
  .masthead-stage {
    padding-right: 12px;
    padding-left: 12px;
  }

  .masthead {
    font-size: clamp(2.35rem, 13.6vw, 4.8rem);
  }

  .masthead-face > span {
    transform: scaleX(0.96);
  }
}
'''

          text += guard
          path.write_text(text, encoding="utf-8")

          verified = path.read_text(encoding="utf-8")
          required = [
              marker,
              "font-size: clamp(2.8rem, 13.8vw, 5.9rem);",
              "font-size: clamp(2.35rem, 13.6vw, 4.8rem);",
              "transform: scaleX(0.96);",
              "-webkit-text-size-adjust: 100%;",
          ]
          for snippet in required:
              if verified.count(snippet) != 1:
                  raise SystemExit(f"Verification failed for {snippet!r}")
          PY

      - name: Commit fix and remove one-off workflow
        shell: bash
        run: |
          rm .github/workflows/fix-mobile-masthead.yml
          git config user.name "Movie Master Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add styles.css .github/workflows/fix-mobile-masthead.yml
          git commit -m "Prevent mobile masthead clipping"
          git push origin HEAD:agent/movie-master-site
