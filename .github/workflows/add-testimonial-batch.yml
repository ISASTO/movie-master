name: Add testimonial batch

on:
  push:
    branches:
      - agent/testimonial-batch-staging
    paths:
      - .github/workflows/add-testimonial-batch.yml

permissions:
  contents: write

jobs:
  add-testimonials:
    runs-on: ubuntu-latest

    steps:
      - name: Check out live site branch
        uses: actions/checkout@v4
        with:
          ref: agent/testimonial-batch-staging

      - name: Install image and HTML tools
        run: python3 -m pip install --quiet pillow beautifulsoup4 requests

      - name: Add portraits and testimonials
        shell: bash
        run: |
          cat > /tmp/add_testimonials.py <<'PY'
          from pathlib import Path
          from io import BytesIO
          import html
          import re
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image, ImageOps

          root = Path('.')
          html_path = root / 'index.html'
          js_path = root / 'script.js'
          portraits_dir = root / 'assets' / 'portraits'
          portraits_dir.mkdir(parents=True, exist_ok=True)

          new_items = [
              {
                  'name': 'Trent K.',
                  'gender': 'M',
                  'slug': 'trent',
                  'quote': "My only exposure to movies before the Movie Master was VHS tapes my parents brought home from the thrift store. In my state of blissful ignorance, I thought they were hits. I actually thought I liked them. But since the Movie Master has shown me what a true Smash Blockbuster Hit is, I now realize that those old VHS tapes were all nothing but garbage 🗑️. I went to my parents house, gathered them all up, and threw them away. Now I only watch movies the Movie Master recommends.",
                  'image_url': 'https://images.pexels.com/photos/12191496/pexels-photo-12191496.jpeg?cs=srgb&dl=pexels-iamdanzor-12191496.jpg&fm=jpg',
                  'source_page': 'https://www.pexels.com/photo/portrait-of-young-man-12191496/',
                  'photographer': 'Daniel Friday Danzor',
                  'center': (0.50, 0.38),
              },
              {
                  'name': 'Cornelia P.',
                  'gender': 'F',
                  'slug': 'cornelia',
                  'quote': "My husband thought he knows good movies. I laughed in his face and told him he's nothing compared to the Movie Master. At first he was upset with me and threatened to never talk to me again, but then I showed him a few Smash Hit Blockbuster Masterpieces recommended by the Movie Master, and he realized that he'd been watching garbage 🗑️ all along. Now we both buy movie recommendations from the Movie Master almost every day, and our marriage has never been better.",
                  'image_url': 'https://images.pexels.com/photos/30004320/pexels-photo-30004320.jpeg?cs=srgb&dl=pexels-prolificpeople-30004320.jpg&fm=jpg',
                  'source_page': 'https://www.pexels.com/photo/professional-headshot-of-smiling-woman-in-black-top-30004320/',
                  'photographer': 'Daniel & Hannah Snipes',
                  'center': (0.50, 0.36),
              },
              {
                  'name': 'Tobey M.',
                  'gender': 'M',
                  'slug': 'tobey',
                  'quote': "I used to have twelve horses whom I loved like my own family. I tended to them every day. Then one day at the horse food store I saw a flyer for the Movie Master and decided to buy some movie recommendations from him. They were so good that I just wanted to do nothing but watch them all day. So I sold my horses to pay for more movie recommendations, and now I couldn't be happier.",
                  'image_url': 'https://images.pexels.com/photos/7625294/pexels-photo-7625294.jpeg?cs=srgb&dl=pexels-mikhail-nilov-7625294.jpg&fm=jpg',
                  'source_page': 'https://www.pexels.com/photo/headshot-of-a-man-smiling-7625294/',
                  'photographer': 'Mikhail Nilov',
                  'center': (0.50, 0.40),
              },
              {
                  'name': 'Kara F.',
                  'gender': 'F',
                  'slug': 'kara',
                  'quote': "Sometimes I wonder what it must be like to be the Movie Master. Sure, he has all the best movie opinions and he knows all the best Blockbuster Hit Masterpieces, but it must be torturous for him to know that people watch garbage 🗑️. He is unfathomably strong for handling such a burden with such grace.",
                  'image_url': 'https://images.pexels.com/photos/10025071/pexels-photo-10025071.jpeg?cs=srgb&dl=pexels-edmosckov-10025071.jpg&fm=jpg',
                  'source_page': 'https://www.pexels.com/photo/headshot-of-a-young-woman-with-short-hair-10025071/',
                  'photographer': 'Eduard Sheryshev',
                  'center': (0.50, 0.39),
              },
              {
                  'name': 'Robert B.',
                  'gender': 'M',
                  'slug': 'robert',
                  'quote': "I wish I knew how the Movie Master's mind works. It's nothing short of a miracle that one man can have such vast movie knowledge and such correct movie opinions. It truly blows my mind to even try to imagine the inner workings of his brain.",
                  'image_url': 'https://images.pexels.com/photos/13498045/pexels-photo-13498045.jpeg?cs=srgb&dl=pexels-marceloverfe-13498045.jpg&fm=jpg',
                  'source_page': 'https://www.pexels.com/photo/portrait-of-a-bearded-man-13498045/',
                  'photographer': 'Marcelo Verfe',
                  'center': (0.50, 0.39),
              },
              {
                  'name': 'Suzi W.',
                  'gender': 'F',
                  'slug': 'suzi',
                  'quote': "If I had an opportunity to tell one thing to the entire world's population, I would tell them to all buy movie recommendations from the Movie Master. That's how much I value his recommendations.",
                  'image_url': 'https://images.pexels.com/photos/12626141/pexels-photo-12626141.jpeg?cs=srgb&dl=pexels-evlogia-pictures-3056207-12626141.jpg&fm=jpg',
                  'source_page': 'https://www.pexels.com/photo/portrait-of-beautiful-woman-smiling-12626141/',
                  'photographer': 'Evlogia Pictures',
                  'center': (0.50, 0.40),
              },
              {
                  'name': 'Brock H.',
                  'gender': 'M',
                  'slug': 'brock',
                  'quote': "My dad bet me one hundred dollars that I couldn't name 10 of the best movies ever made. He was right, but I had an ace up my sleeve. That ace goes by the name of the Movie Master. I sent him a quick message on Facebook, and just a few minutes later I had 10 absolute jaw-dropping Smash Hit Masterpieces. I told my dad the movies, and he had no choice but to admit defeat and hand over the one hundred clams (dollars). Want to guess what I spent the money on? I'll tell you. I spent the money on more movie recommendations from the Movie Master.",
                  'image_url': 'https://images.pexels.com/photos/12311514/pexels-photo-12311514.jpeg?cs=srgb&dl=pexels-josepheulo-nyc-12311514.jpg&fm=jpg',
                  'source_page': 'https://www.pexels.com/photo/portrait-of-a-smiling-man-12311514/',
                  'photographer': 'Joseph Eulo',
                  'center': (0.50, 0.42),
              },
              {
                  'name': 'Leslie B.',
                  'gender': 'F',
                  'slug': 'leslie',
                  'quote': "An apple a day keeps the doctor away, but you'd be far better off spending the money you would spend on all those apples on movie recommendations from the Movie Master instead. Because a Smash Blockbuster Hit movie a day keeps you happy.",
                  'image_url': 'https://images.pexels.com/photos/5231279/pexels-photo-5231279.jpeg?cs=srgb&dl=pexels-shvetsa-5231279.jpg&fm=jpg',
                  'source_page': 'https://www.pexels.com/photo/crop-elderly-woman-with-gray-hair-5231279/',
                  'photographer': 'Anna Shvets',
                  'center': (0.47, 0.46),
              },
          ]

          gender_by_name = {
              'Wert P.': 'M', 'Josephina B.': 'F', 'Torrin W.': 'M', 'Sarah B.': 'F',
              'Gabriel W.': 'M', 'Polly P.': 'F', 'George W.': 'M', 'Leona S.': 'F',
              'Tom F.': 'M', 'Sabrina C.': 'F', 'Maynard P.': 'M', 'Trisha B.': 'F',
              'Jack R.': 'M', 'Greta H.': 'F', 'Lucas P.': 'M', 'Rebecca U.': 'F',
              'Thomas L.': 'M', 'Holly H.': 'F', 'Eric W.': 'M', 'Geodonia S.': 'F',
              'Bilbert W.': 'M', 'Rachel L.': 'F', 'Isaac S.': 'M', 'Inez P.': 'F',
          }
          gender_by_name.update({item['name']: item['gender'] for item in new_items})

          def crop_square(image, center):
              image = ImageOps.exif_transpose(image).convert('RGB')
              width, height = image.size
              side = min(width, height)
              cx = max(0.0, min(1.0, center[0])) * width
              cy = max(0.0, min(1.0, center[1])) * height
              left = int(round(cx - side / 2))
              top = int(round(cy - side / 2))
              left = max(0, min(left, width - side))
              top = max(0, min(top, height - side))
              return image.crop((left, top, left + side, top + side))

          session = requests.Session()
          session.headers.update({'User-Agent': 'Mozilla/5.0 MovieMasterSite/1.0'})
          for item in new_items:
              response = session.get(item['image_url'], timeout=45)
              response.raise_for_status()
              image = Image.open(BytesIO(response.content))
              image = crop_square(image, item['center'])
              image = image.resize((480, 480), Image.Resampling.LANCZOS)
              output = portraits_dir / f"{item['slug']}.webp"
              image.save(output, 'WEBP', quality=88, method=6)

          source_lines = [
              '# New testimonial portrait sources',
              '',
              'All eight portraits in this batch are real photographs sourced from Pexels pages marked free to use.',
              '',
          ]
          for item in new_items:
              source_lines.append(f"- **{item['name']}** — Photo by {item['photographer']}: {item['source_page']}")
          source_lines.append('')
          (portraits_dir / 'new-testimonial-sources.md').write_text('\n'.join(source_lines), encoding='utf-8')

          source = html_path.read_text(encoding='utf-8')
          soup = BeautifulSoup(source, 'html.parser')
          grid = soup.select_one('#testimonial-grid')
          if grid is None:
              raise SystemExit('testimonial grid not found')

          existing = []
          for card in grid.select(':scope > article.testimonial-card'):
              quote_node = card.select_one('.testimonial-quote')
              name_node = card.select_one('figcaption')
              image_node = card.select_one('img')
              if not quote_node or not name_node or not image_node:
                  raise SystemExit('existing testimonial card is incomplete')
              name = name_node.get_text(' ', strip=True)
              quote = ' '.join(quote_node.get_text(' ', strip=True).split())
              if name not in gender_by_name:
                  raise SystemExit(f'unknown testimonial gender for {name}')
              existing.append({
                  'name': name,
                  'gender': gender_by_name[name],
                  'quote': quote,
                  'image_path': image_node.get('src'),
              })

          if len(existing) != 24:
              raise SystemExit(f'expected 24 existing testimonials, found {len(existing)}')

          all_items = existing + [
              {
                  'name': item['name'],
                  'gender': item['gender'],
                  'quote': item['quote'],
                  'image_path': f"./assets/portraits/{item['slug']}.webp",
              }
              for item in new_items
          ]

          males = sorted((x for x in all_items if x['gender'] == 'M'), key=lambda x: len(x['quote']))
          females = sorted((x for x in all_items if x['gender'] == 'F'), key=lambda x: len(x['quote']))
          if len(males) != 16 or len(females) != 16:
              raise SystemExit(f'expected 16 male and 16 female testimonials; got {len(males)} and {len(females)}')

          ordered = []
          for male, female in zip(males, females):
              ordered.extend([male, female])

          marquee_names = {
              item['name']
              for item in sorted(all_items, key=lambda x: len(x['quote']))[:12]
          }

          def make_card(item, index):
              card = soup.new_tag('article')
              classes = ['testimonial-card']
              if index < 8:
                  classes.append('reveal-on-scroll')
              else:
                  classes.append('testimonial-extra')
              if item['name'] in marquee_names:
                  classes.append('testimonial-marquee-source')
              card['class'] = classes
              if index >= 8:
                  card['hidden'] = ''

              blockquote = soup.new_tag('blockquote')
              blockquote['class'] = ['quote-bubble', 'testimonial-quote']
              blockquote.string = item['quote']
              card.append(blockquote)

              figure = soup.new_tag('figure')
              frame = soup.new_tag('div')
              frame['class'] = ['portrait-frame']
              image = soup.new_tag('img')
              image['src'] = item['image_path']
              image['alt'] = ''
              image['loading'] = 'lazy'
              image['width'] = '480'
              image['height'] = '480'
              frame.append(image)
              figure.append(frame)
              caption = soup.new_tag('figcaption')
              caption.string = item['name']
              figure.append(caption)
              card.append(figure)
              return card

          grid.clear()
          for index, item in enumerate(ordered):
              grid.append('\n')
              grid.append(make_card(item, index))
              grid.append('\n')

          rendered = str(soup)
          rendered = rendered.replace('<!DOCTYPE html>\n', '<!DOCTYPE html>\n')
          html_path.write_text(rendered, encoding='utf-8')

          js = js_path.read_text(encoding='utf-8')
          old_selector = 'document.querySelectorAll(".testimonial-card")'
          new_selector = 'document.querySelectorAll(".testimonial-card.testimonial-marquee-source")'
          if js.count(old_selector) != 1:
              raise SystemExit(f'expected one marquee testimonial selector, found {js.count(old_selector)}')
          js = js.replace(old_selector, new_selector, 1)
          js_path.write_text(js, encoding='utf-8')

          # Final validation.
          verified_soup = BeautifulSoup(html_path.read_text(encoding='utf-8'), 'html.parser')
          cards = verified_soup.select('#testimonial-grid > article.testimonial-card')
          if len(cards) != 32:
              raise SystemExit(f'expected 32 final cards, found {len(cards)}')
          visible = [c for c in cards if not c.has_attr('hidden')]
          hidden = [c for c in cards if c.has_attr('hidden')]
          if len(visible) != 8 or len(hidden) != 24:
              raise SystemExit(f'expected 8 visible and 24 hidden; got {len(visible)} and {len(hidden)}')
          marquee = [c for c in cards if 'testimonial-marquee-source' in c.get('class', [])]
          if len(marquee) != 12:
              raise SystemExit(f'expected 12 selective marquee cards, found {len(marquee)}')

          final_names = [c.select_one('figcaption').get_text(' ', strip=True) for c in cards]
          final_genders = [gender_by_name[name] for name in final_names]
          expected_genders = ['M' if index % 2 == 0 else 'F' for index in range(32)]
          if final_genders != expected_genders:
              raise SystemExit(f'gender alternation failed: {final_genders}')

          text_by_name = {
              c.select_one('figcaption').get_text(' ', strip=True):
              ' '.join(c.select_one('.testimonial-quote').get_text(' ', strip=True).split())
              for c in cards
          }
          for item in new_items:
              if text_by_name.get(item['name']) != item['quote']:
                  raise SystemExit(f"quote changed for {item['name']}")
              portrait = Image.open(portraits_dir / f"{item['slug']}.webp")
              if portrait.size != (480, 480):
                  raise SystemExit(f"portrait dimensions wrong for {item['name']}: {portrait.size}")

          if 'document.querySelectorAll(".testimonial-card.testimonial-marquee-source")' not in js_path.read_text(encoding='utf-8'):
              raise SystemExit('selective marquee selector missing')
          PY
          python3 /tmp/add_testimonials.py

      - name: Commit batch and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/add-testimonial-batch.yml
          git config user.name "Movie Master Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html script.js assets/portraits .github/workflows/add-testimonial-batch.yml
          git commit -m "Add eight Movie Master testimonials"
          git push origin HEAD:agent/testimonial-batch-staging
