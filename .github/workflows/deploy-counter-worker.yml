name: Deploy counter Worker

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-counter-worker.yml

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: counter-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Worker tests
        run: npm test

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured in GitHub Actions secrets."
            exit 2
          fi

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.127.1 deploy
