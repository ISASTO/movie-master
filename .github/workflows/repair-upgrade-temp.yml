name: Temporary Upgrade Repair

on:
  push:
    branches:
      - analytics-run-details-upgrade

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Finalize tested analytics upgrade'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore full game markup
        run: |
          git fetch origin main
          git checkout origin/main -- game/index.html

      - name: Apply deterministic finalizer
        run: python scripts/finalize_upgrade.py

      - name: Verify intended markup and cleanup
        run: |
          test "$(wc -l < game/index.html)" -gt 350
          grep -q 'leaderboard-upgrades.css?v=20260902-1' game/index.html
          grep -q 'game-records.js?v=20260902-run-analytics-2' game/index.html
          grep -q 'leaderboard.js?v=20260902-run-analytics-2' game/index.html
          ! grep -q "THE WORLD'S BEST AND MOST CORRECT PLAYERS" game/index.html
          ! grep -q 'DAILY BOARDS RESET AT MIDNIGHT CENTRAL TIME' game/index.html
          ! grep -q 'leaderboard-placement-status' game/index.html
          grep -q 'run-details-overrides.css?v=20260902-1' analytics/index.html
          grep -q 'mode-leaderboards.js?v=20260902-run-details-2' analytics/index.html
          ! grep -q 'leaderboardResult' counter-worker/src/insights.js
          test -f game/leaderboard-upgrades.css
          test -f analytics/run-details-overrides.css

      - name: Run Worker regression tests
        working-directory: counter-worker
        run: npm test

      - name: Check upgraded browser script syntax
        run: |
          node --check game-records.js
          node --check game/leaderboard.js
          node --check analytics/mode-leaderboards.js

      - name: Commit finalized upgrade
        run: |
          git config user.name ISASTO
          git config user.email 54598558+ISASTO@users.noreply.github.com
          git add game/index.html analytics/index.html counter-worker/src/insights.js
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize tested analytics upgrade'
          git push origin HEAD:analytics-run-details-upgrade
