name: Early run finalization

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/early-run-finalization.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply lifecycle patch
        run: python .github/scripts/early-run-finalization.py

      - name: JavaScript syntax validation
        run: |
          node --check game/game.js
          node --check game-records.js

      - name: Validate lifecycle invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          game = Path('game/game.js').read_text()
          records = Path('game-records.js').read_text()
          index = Path('game/index.html').read_text()
          assert 'const startButtons =' not in records
          assert records.count('movie-master:game-run-started') == 1
          assert records.count('movie-master:game-run-finalized') == 1
          assert game.count('movie-master:game-run-started') == 1
          assert game.count('movie-master:game-run-finalized') == 1
          assert 'finalizeRunForTracking("reset")' in game
          assert 'finalizeRunForTracking("exit")' in game
          assert 'finalizeRunForTracking("pagehide")' in game
          assert 'event.persisted' in game
          assert 'Promise.race' in game and '650' in game
          assert 'game-records.js?v=20260905-early-finish-1' in index
          assert 'game.js?v=20260905-early-finish-1' in index
          PY
          git diff --check

      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/game.js game-records.js game/index.html
          git commit -m "Record early-ended game runs"
          git push origin HEAD:main
