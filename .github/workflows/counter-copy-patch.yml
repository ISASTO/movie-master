name: Patch visitor counter copy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/counter-copy-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update counter wording
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text()
          html = html.replace(
              'aria-label="THE MOVIE MASTER HAS 0 SATISFIED CUSTOMERS AND COUNTING!"',
              'aria-label="THIS SITE HAS HAD 0 VISITORS AND COUNTING!"'
          )
          html = html.replace(
              '<span class="counter-label">THE MOVIE MASTER HAS</span>',
              '<span class="counter-label">THIS SITE HAS HAD</span>'
          )
          html = html.replace(
              '<span class="counter-label">SATISFIED CUSTOMERS AND COUNTING!</span>',
              '<span class="counter-label">VISITORS AND COUNTING!</span>'
          )
          html = html.replace(
              './script.js?v=20260827-referral-share',
              './script.js?v=20260831-real-visitors-copy'
          )
          index.write_text(html)

          script = Path('script.js')
          js = script.read_text()
          js = js.replace(
              '`THE MOVIE MASTER HAS ${formatted} SATISFIED CUSTOMERS AND COUNTING!`',
              '`THIS SITE HAS HAD ${formatted} VISITORS AND COUNTING!`'
          )
          script.write_text(js)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script.js
          git commit -m "Update visitor counter wording"
          git push
