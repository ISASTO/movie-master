name: Patch real visitor counter

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/visitor-counter-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Replace visitor counter function
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('script.js')
          text = path.read_text()
          replacement = Path('counter-worker/frontend-counter-function.txt').read_text()
          start = text.index('  function setUpVisitorCounter() {')
          end = text.index('  function setUpPurchaseFlow() {', start)
          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Commit patch
        run: |
          if git diff --quiet -- script.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git commit -m "Use real unique visitor counter"
          git push
