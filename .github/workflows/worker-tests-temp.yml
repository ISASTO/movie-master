name: Temporary Worker Regression Tests

on:
  push:
    branches:
      - analytics-run-details-upgrade
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Worker tests
        working-directory: counter-worker
        run: npm test
      - name: Check browser script syntax
        run: |
          node --check game-records.js
          node --check game/leaderboard.js
          node --check analytics/mode-leaderboards.js
