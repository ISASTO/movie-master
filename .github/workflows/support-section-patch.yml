name: Support section patch

on:
  push:
    branches:
      - movie-master-support-section
    paths:
      - .github/workflows/support-section-patch.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: movie-master-support-section
          fetch-depth: 0

      - name: Apply support section patch
        run: python .github/scripts/add-support-section.py

      - name: Validate diff whitespace
        run: git diff --check

      - name: Validate requested copy and placement
        run: |
          grep -q 'WANT TO HELP THE MOVIE MASTER GROW?' index.html
          grep -q 'GIVE THE MOVIE MASTER MONEY' index.html
          grep -q "This isn't a recommendation package. You are just giving the Movie Master money for free." index.html
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text()
          merch = text.index('class="section merch-section"')
          support = text.index('class="section support-section"')
          faq = text.index('class="section faq-section"')
          assert merch < support < faq
          PY

      - name: Commit validated production changes
        run: |
          if git diff --quiet -- index.html styles.css; then
            echo "No production changes to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css
          git commit -m "Add Movie Master support section"
          git push origin HEAD:movie-master-support-section
