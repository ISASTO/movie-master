name: Add welcome banner

on:
  push:
    paths:
      - '.github/workflows/add-welcome-banner.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add welcoming all-ages banner
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          index_path = Path('index.html')
          css_path = Path('styles.css')
          workflow_path = Path('.github/workflows/add-welcome-banner.yml')

          html = index_path.read_text()
          marker = '''          <div class="regulations-board">\n            <article class="authority-notice reveal-on-scroll">'''
          banner = '''          <div class="regulations-board">\n            <article class="welcome-banner reveal-on-scroll">\n              <div class="welcome-banner-art welcome-banner-art-left" aria-hidden="true">\n                <span>🌼</span>\n                <span>🙂</span>\n                <span>🧑‍🤝‍🧑</span>\n              </div>\n              <div class="welcome-banner-copy">\n                <h3>ALL AGES AND ALL PEOPLE WELCOME</h3>\n                <p>\n                  The Movie Master has something for everyone. If you are an old person, a regular adult,\n                  or even a child, the Movie Master will know the best movies for you to watch.\n                </p>\n              </div>\n              <div class="welcome-banner-art welcome-banner-art-right" aria-hidden="true">\n                <span>🧑‍🤝‍🧑</span>\n                <span>🙂</span>\n                <span>🌸</span>\n              </div>\n            </article>\n\n            <article class="authority-notice reveal-on-scroll">'''
          if 'ALL AGES AND ALL PEOPLE WELCOME' not in html:
              if marker not in html:
                  raise SystemExit('Could not find rules banner insertion point')
              html = html.replace(marker, banner, 1)
              index_path.write_text(html)

          css = css_path.read_text()
          styles = textwrap.dedent(r'''

          /* All-ages welcome banner */
          .welcome-banner {
            position: relative;
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: minmax(92px, 0.7fr) minmax(0, 4.8fr) minmax(92px, 0.7fr);
            align-items: center;
            gap: clamp(14px, 2vw, 28px);
            min-height: 210px;
            padding: clamp(22px, 3.2vw, 38px);
            overflow: hidden;
            border: 5px solid var(--ink);
            outline: 5px solid var(--gold-bright);
            outline-offset: -11px;
            background:
              radial-gradient(circle at 12% 18%, rgba(255, 255, 255, 0.72), transparent 24%),
              radial-gradient(circle at 86% 78%, rgba(255, 255, 255, 0.62), transparent 26%),
              linear-gradient(120deg, #ffe9a8 0%, #ffd8df 35%, #cfeaff 68%, #dff4cf 100%);
            box-shadow: 12px 12px 0 rgba(79, 35, 0, 0.28);
          }

          .welcome-banner::before,
          .welcome-banner::after {
            content: "";
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            opacity: 0.28;
            pointer-events: none;
          }

          .welcome-banner::before {
            top: -72px;
            left: 23%;
            background: #ff9fb6;
          }

          .welcome-banner::after {
            right: 20%;
            bottom: -82px;
            background: #76c7ff;
          }

          .welcome-banner-copy {
            position: relative;
            z-index: 2;
            text-align: center;
          }

          .welcome-banner-copy h3 {
            margin: 0 0 12px;
            color: var(--purple-dark);
            font-family: "Alfa Movie", Rockwell, "Roboto Slab", serif;
            font-size: clamp(2rem, 4.2vw, 4.2rem);
            font-weight: 400;
            line-height: 0.98;
            letter-spacing: -0.035em;
            text-transform: uppercase;
            text-shadow: 2px 2px 0 rgba(255, 255, 255, 0.8);
          }

          .welcome-banner-copy p {
            max-width: 820px;
            margin: 0 auto;
            color: var(--ink);
            font-size: clamp(1rem, 1.5vw, 1.28rem);
            font-weight: 700;
            line-height: 1.42;
          }

          .welcome-banner-art {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 7px;
            font-size: clamp(2rem, 4vw, 4rem);
            line-height: 1;
            filter: drop-shadow(2px 3px 0 rgba(255, 255, 255, 0.82));
          }

          .welcome-banner-art span:nth-child(2) {
            transform: scale(1.12) rotate(-5deg);
          }

          .welcome-banner-art-right span:nth-child(2) {
            transform: scale(1.12) rotate(5deg);
          }

          @media (max-width: 720px) {
            .welcome-banner {
              grid-template-columns: 1fr;
              gap: 12px;
              min-height: 0;
              padding: 25px 20px 27px;
              outline-width: 4px;
              outline-offset: -10px;
              box-shadow: 8px 8px 0 rgba(79, 35, 0, 0.28);
            }

            .welcome-banner-art {
              flex-direction: row;
              gap: 14px;
              font-size: clamp(1.9rem, 9vw, 3rem);
            }

            .welcome-banner-art-right {
              display: none;
            }

            .welcome-banner-copy h3 {
              font-size: clamp(2rem, 10vw, 3.25rem);
            }

            .welcome-banner-copy p {
              font-size: 1rem;
              line-height: 1.45;
            }
          }
          ''')
          if '/* All-ages welcome banner */' not in css:
              css_path.write_text(css.rstrip() + styles + '\n')

          if workflow_path.exists():
              workflow_path.unlink()
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css .github/workflows/add-welcome-banner.yml
          git diff --cached --quiet && exit 0
          git commit -m "Add all-ages welcome banner"
          git push
